set_window:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: dev_house
          domain: binary_sensor
          multiple: true
    open:
      selector:
        boolean:
turn_dial:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: dev_house
          domain: climate
          multiple: true
    temperature:
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    hvac_mode:
      selector:
        select:
          options: ["off", "heat"]
set_air_temperature:
  fields:
    room:
      required: true
      selector:
        select:
          options:
            - Living Room
            - Kitchen
            - Hallway
            - Toilet
            - Bedroom
            - Kids Room
            - Bathroom
            - Upstairs Hallway
            - Office
    temperature:
      required: true
      selector:
        number:
          min: 0
          max: 35
          step: 0.1
          unit_of_measurement: "°C"
set_outdoor_temperature:
  fields:
    temperature:
      required: true
      selector:
        number:
          min: -20
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
drop_connection:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: dev_house
          domain: climate
          multiple: true
    seconds:
      default: 12
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
